<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concurrency check</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      max-width: 650px;
      width: 100%;
      padding: 32px;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
    }
    pre#result {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      padding: 16px;
      border-radius: 8px;
      background: #f1f5f9;
      border-left: 5px solid #64748b;
      margin: 20px 0;
      white-space: pre-wrap;
    }
    pre#result.pass {
      background: #f0fdf4;
      border-left-color: #22c55e;
      color: #166534;
      font-weight: 600;
    }
    pre#result.fail {
      background: #fef2f2;
      border-left-color: #ef4444;
      color: #991b1b;
      font-weight: 600;
    }
    .diagnostics {
      margin-top: 24px;
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
      color: #64748b;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-alarm { background: #fee2e2; color: #dc2626; }
    .badge-normal { background: #dcfce7; color: #16a34a; }
  </style>
</head>
<body>
<div class="card">
  <h1>Alarm concurrency check</h1>
  <pre id="result">Running...</pre>
  <div id="diagnostics" class="diagnostics" style="display: none;">
    <h3 style="margin: 0; font-size: 16px; color: #334155;">Telemetry Diagnostics</h3>
    <table id="diag-table">
      <thead>
        <tr>
          <th>Tank ID</th>
          <th>Level</th>
          <th>State</th>
          <th>Transitions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script src="../src/lib/telemetry-manager.js"></script>
<script>
  const TANKS = ['tank-1', 'tank-2', 'tank-3', 'tank-4'];
  const EVENTS = 10;
  let audioCalls = 0;
  const manager = new TelemetryManager({ onAlarm: () => { audioCalls++; } });

  let done = 0;
  for (let i = 0; i < EVENTS; i++) {
    setTimeout(() => {
      manager.update(TANKS[i % TANKS.length], 15);   // 15% is below the 20% threshold
      if (++done === EVENTS) report();
    }, 0);
  }

  function report() {
    const pass = manager.alarmCount === 4 && audioCalls === 4;
    const resultEl = document.getElementById('result');
    resultEl.textContent =
      (pass ? 'PASS' : 'FAIL') + ' - alarm triggers: ' + manager.alarmCount + ' (expected 4)';
    resultEl.className = pass ? 'pass' : 'fail';

    const diag = document.getElementById('diagnostics');
    if (diag && manager.tanks) {
      diag.style.display = 'block';
      const tbody = document.querySelector('#diag-table tbody');
      if (tbody) {
        tbody.innerHTML = '';
        TANKS.forEach(id => {
          const t = manager.tanks[id] || {};
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${id}</strong></td>
            <td>${t.level !== undefined ? t.level + '%' : 'N/A'}</td>
            <td><span class="badge ${t.state === 'ALARM' ? 'badge-alarm' : 'badge-normal'}">${t.state || 'NORMAL'}</span></td>
            <td>${t.transitionCount || 1}</td>
          `;
          tbody.appendChild(row);
        });
      }
    }
  }
</script>
</body>
</html>
